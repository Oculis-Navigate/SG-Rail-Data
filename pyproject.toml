[project]
name = "sg-rail-station-data"
version = "0.1.0"
description = "Deterministic Singapore MRT/LRT station data pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.14.3",
]

[project.scripts]
sg-rail-station-data = "sg_rail_station_data.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
