name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4e # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked environment
        run: uv sync --frozen

      - name: Detect changes requiring data review
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          scope=$(sh .githooks/change-scope "$BASE" HEAD)
          echo "kind=$scope" >> "$GITHUB_OUTPUT"

      - name: Validate configuration
        run: uv run sg-rail-station-data config validate

      - name: Validate audit ledger
        if: steps.scope.outputs.kind != 'regular'
        run: uv run sg-rail-station-data audit validate

      - name: Check generated sign-off pages
        if: steps.scope.outputs.kind != 'regular'
        run: |
          uv run sg-rail-station-data audit render
          git diff --exit-code -- audit/signoffs

      - name: Verify reviewed changes against the PR or push base (offline replay)
        if: steps.scope.outputs.kind != 'regular'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/dataset.py gate "$BASE"

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
