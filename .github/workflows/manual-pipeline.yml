name: Wayfinding pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 1,4,7,10 *"

concurrency:
  group: mrt-wayfinding-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python
        run: uv python install 3.12

      - name: Validate locked environment
        run: uv sync --frozen

      - name: Validate DataMall credential
        run: uv run mrt-wayfinding credentials validate

      - name: Run pipeline
        id: pipeline
        shell: bash
        run: |
          set +e
          uv run mrt-wayfinding pipeline run --json | tee pipeline-result.json
          pipeline_exit=${PIPESTATUS[0]}
          echo "exit_code=${pipeline_exit}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain immutable evidence and review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrt-wayfinding-${{ github.run_id }}
          path: |
            runs/
            pipeline-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce pipeline result
        shell: bash
        run: |
          code="${{ steps.pipeline.outputs.exit_code }}"
          if [[ "$code" == "2" ]]; then
            echo "::warning::The wayfinding pipeline saved valid evidence requiring human review. Download the run artifact."
          fi
          exit "$code"
